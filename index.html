<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swell test</title>
<style>
  body{margin:0;min-height:100vh;background:#0d1626;color:#EDE8DD;
       font-family:-apple-system,system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .card{max-width:420px}
  h1{font-size:24px;margin:0 0 8px}
  p{color:#9aa3bd;font-size:15px;line-height:1.5}
  .big{font-size:40px}
  button{margin-top:18px;padding:12px 18px;border:none;border-radius:12px;
         background:#F2B65A;color:#15110a;font-size:16px;font-weight:700;cursor:pointer}
  .row{margin-top:16px;font-size:14px;color:#56C8C0}
  code{background:#1a2c49;padding:2px 6px;border-radius:6px;color:#EDE8DD}
</style>
</head>
<body>
  <div class="card">
    <div class="big">✅</div>
    <h1>Your hosting works</h1>
    <p>If you can read this, then GitHub Pages, your browser, HTML, and CSS are all fine — and the problem is something specific in the big app file that we can fix.</p>

    <button id="btn">Tap me</button>
    <div class="row" id="clicks">Button works: not tested yet</div>
    <div class="row" id="opens">Checking saved data…</div>
  </div>

  <script>
    // Test 1: JavaScript runs
    var n = 0;
    document.getElementById("btn").addEventListener("click", function () {
      n++;
      document.getElementById("clicks").textContent = "Button works ✓ — tapped " + n + " time(s)";
    });

    // Test 2: localStorage persists across reloads
    try {
      var opens = parseInt(localStorage.getItem("swell_test_opens") || "0", 10) + 1;
      localStorage.setItem("swell_test_opens", String(opens));
      document.getElementById("opens").textContent =
        "Saved data works ✓ — you've opened this page " + opens + " time(s) (reload to see it grow)";
    } catch (e) {
      document.getElementById("opens").textContent = "⚠ Saved data blocked: " + e.message;
    }
  </script>
</body>
</html>
